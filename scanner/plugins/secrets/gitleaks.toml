# cbomkit-theia's additional Gitleaks rules.
#
# This file is merged into Gitleaks' default configuration (gitleaks/config.DefaultConfig) by
# newSecretsDetector (see mergeExtraRules); it is deliberately NOT a standalone config and must not
# use `[extend]`. A rule reusing a default rule's ID is merged into it, as `[extend]` would.
# Gitleaks' `[extend] useDefault = true` bumps a package-global depth counter on every load and
# silently stops extending after the second one, so detectors built later lose all default rules.

[[rules]]
id = "public-key-file"
description = "Public key file present"
path = '''(?i)\.pub$'''

[[rules]]
id = "pem-public-key"
description = "Identified a PEM-encoded public key."
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PUBLIC KEY-----[\s\S-]{16,}?PUBLIC KEY-----'''
keywords = ["-----begin"]
