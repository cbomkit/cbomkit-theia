title = "cbomkit-theia extended gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "public-key-file"
description = "Public key file present"
path = '''(?i)\.pub$'''

[[rules]]
id = "csr-file"
description = "Certificate signing request file present"
path = '''(?i)\.csr$'''

[[rules]]
id = "pem-csr"
description = "Identified a PEM-encoded PKCS#10 certificate signing request."
regex = '''(?i)-----BEGIN (?:NEW )?CERTIFICATE REQUEST-----[\s\S]{16,}?CERTIFICATE REQUEST-----'''
keywords = ["-----begin"]

[[rules]]
id = "pem-public-key"
description = "Identified a PEM-encoded public key."
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PUBLIC KEY-----[\s\S-]{16,}?PUBLIC KEY-----'''
keywords = ["-----begin"]

[[rules]]
id = "openssh-public-key"
description = "Identified an OpenSSH authorized_keys-format public key."
regex = '''\b(?:ssh-rsa|ssh-dss|ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521|ssh-rsa-cert-v01@openssh\.com|ssh-dss-cert-v01@openssh\.com|ssh-ed25519-cert-v01@openssh\.com|ecdsa-sha2-nistp256-cert-v01@openssh\.com|ecdsa-sha2-nistp384-cert-v01@openssh\.com|ecdsa-sha2-nistp521-cert-v01@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256-cert-v01@openssh\.com|sk-ssh-ed25519-cert-v01@openssh\.com) [A-Za-z0-9+/]{20,}={0,3}'''
keywords = ["ssh-rsa", "ssh-dss", "ssh-ed25519", "ecdsa-sha2-nistp256", "ecdsa-sha2-nistp384", "ecdsa-sha2-nistp521"]

[[rules]]
id = "ssh2-public-key"
description = "Identified an RFC 4716 (SSH2 / ssh.com Tectia) public key block."
regex = '''---- BEGIN SSH2 PUBLIC KEY ----[\s\S]{16,}?---- END SSH2 PUBLIC KEY ----'''
keywords = ["---- begin ssh2 public key ----"]

[[rules]]
id = "pgp-public-key"
description = "Identified an OpenPGP public key block."
regex = '''(?i)-----BEGIN PGP PUBLIC KEY BLOCK-----[\s\S]{16,}?-----END PGP PUBLIC KEY BLOCK-----'''
keywords = ["-----begin pgp public key block-----"]

[[rules]]
id = "wireguard-public-key"
description = "Identified a WireGuard public key."
regex = '''(?i)PublicKey\s*=\s*[A-Za-z0-9+/]{43}='''
keywords = ["publickey"]

[[rules]]
id = "wireguard-private-key"
description = "Identified a WireGuard private key."
regex = '''(?i)PrivateKey\s*=\s*[A-Za-z0-9+/]{43}='''
keywords = ["privatekey"]

[[rules]]
id = "jwk"
description = "Identified a JSON Web Key (JWK). May carry public, private, or symmetric key material."
regex = '''"kty"\s*:\s*"(?:RSA|EC|OKP|oct)"'''
keywords = ["kty"]
